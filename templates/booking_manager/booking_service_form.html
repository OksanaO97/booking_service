{% extends "booking_manager/base.html" %}
{% load crispy_forms_tags %}
{% block content %}

<div class="container my-5" style="max-width: 600px;">
    <div class="card shadow p-4 rounded-3">

        <h4 class="fw-bold mb-4 text-center" style="color: var(--text-light);">Create Booking Service</h4>

        <form method="post" novalidate>
            {% csrf_token %}

            {{ form | crispy }}

            <button type="submit" class="btn btn-warning text-dark w-100 fw-bold py-2 mt-3 text-uppercase shadow-sm">
                Submit New Booking Service
            </button>
        </form>
    </div>
</div>

{% endblock %}
