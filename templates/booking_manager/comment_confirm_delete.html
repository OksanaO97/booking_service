{% extends "booking_manager/base.html" %}

{% block content %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card shadow-sm border border-danger-subtle bg-white p-4 rounded-3 text-center">

        <div class="fs-1 text-danger mb-3">⚠️</div>

        <h4 class="fw-bold text-dark mb-3">Delete Review</h4>
        <p class="text-muted">
            Are you sure you want to permanently delete your review?
        </p>
        <div class="p-3 bg-light rounded text-start border-start border-3 border-danger mb-4">
            <p class="mb-0 text-secondary fst-italic">«{{ object.text }}»</p>
            <small class="text-muted d-block mt-2">Rating: {{ object.rating }}</small>
        </div>

        <form method="post" novalidate>
            {% csrf_token %}

            <div class="d-flex gap-3">

                <a href="{% url 'barber_detail_view' object.barber.id %}" class="btn btn-outline-secondary w-50 py-2 text-uppercase fw-medium shadow-sm">
                    Cancel
                </a>

                <button type="submit" class="btn btn-danger w-50 fw-medium py-2 text-uppercase shadow-sm">
                    Yes, Delete
                </button>
            </div>
        </form>

    </div>
</div>
{% endblock %}
