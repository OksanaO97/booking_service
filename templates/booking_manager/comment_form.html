{% extends "booking_manager/base.html" %}
{% load crispy_forms_tags %}
{% block content %}

<div class="container my-4" style="max-width: 600px;">
    <div class="card shadow-sm border-0 bg-white p-4 rounded-3">
        <form method="post" novalidate>
            {% csrf_token %}

            {{ form | crispy }}

            <button type="submit" class="btn btn-primary w-100 fw-medium py-2 mt-3 text-uppercase shadow-sm focus-ring">
                Submit Comment
            </button>
        </form>
    </div>
</div>

{% endblock %}
