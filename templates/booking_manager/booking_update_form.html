{% extends "booking_manager/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container my-5" style="max-width: 600px;">

    <div class="text-center mb-4">
        <h2 class="text-dark fw-bold">Edit Your Booking</h2>
        <p class="text-muted small">You can change the visit time or selected service below</p>
    </div>

    <div class="card shadow-sm border border-light-subtle bg-white p-4 rounded-3">
        <form method="post" novalidate>
            {% csrf_token %}

            {{ form|crispy }}

            <div class="d-flex gap-3 mt-4">
                <a href="{% url 'booking_detail' object.id %}" class="btn btn-outline-secondary w-50 py-2 text-uppercase fw-medium shadow-sm">
                    Cancel
                </a>

                <button type="submit" class="btn btn-warning text-dark w-50 fw-medium py-2 text-uppercase shadow-sm">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
